name: Publish user guides

on:
  push:
    branches: [main]
    paths:
      - BopItAccess-user-guide.html
      - THIRD-PARTY-NOTICES.txt
      - documentation/*/BopItAccess-user-guide.html
      - documentation/*/THIRD-PARTY-NOTICES.txt
      - .github/workflows/guide-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guide-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the documentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare the user guides
        shell: bash
        run: |
          set -eu
          mkdir -p build/guide-site
          cp BopItAccess-user-guide.html THIRD-PARTY-NOTICES.txt build/guide-site/
          cp BopItAccess-user-guide.html build/guide-site/index.html
          for locale in de es es-MX fr it ja ko pt-BR zh; do
            mkdir -p "build/guide-site/documentation/$locale"
            cp "documentation/$locale/BopItAccess-user-guide.html" \
              "documentation/$locale/THIRD-PARTY-NOTICES.txt" \
              "build/guide-site/documentation/$locale/"
          done
          touch build/guide-site/.nojekyll
      - name: Upload the documentation site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/guide-site
      - name: Publish the documentation site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
